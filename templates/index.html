<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="将订阅链接转换为 sing-box 配置文件的在线工具，支持多订阅合并与模板生成。">
    <meta name="color-scheme" content="light">
    <link rel="icon" href="https://raw.githubusercontent.com/Maritnbk/sing-box-subscribe/refs/heads/main/public/favicon.ico" type="image/x-icon">
    <title>sing-box 配置转换器</title>
    <style>
        /* Hallmark · macrostructure: Workbench · genre: modern-minimal · tone: utilitarian
         * accent: leaf-green ~5% · paper: light (98.2%) · display-style: grotesk-sans
         * surface: glass panel over daily-image backdrop
         * a11y: text always sits on the glass, never directly on the image
         */

        :root {
            /* ── 颜色 ───────────────────────────────────────────── */
            --color-paper:      oklch(98.2% 0.004 250);
            --color-surface:    oklch(100%  0     0);
            --color-ink:        oklch(24.0% 0.015 250);
            --color-ink-2:      oklch(46.0% 0.012 250);
            /* ink-3 压到 52%：玻璃卡片是半透明的，最暗背景下仍需 ≥4.5:1 */
            --color-ink-3:      oklch(52.0% 0.010 250);
            --color-rule:       oklch(88.0% 0.008 250);
            /* border 压到 60%：最暗背景下 UI 边界仍需 ≥3:1 */
            --color-border:     oklch(60.0% 0.010 250);
            --color-accent:     oklch(46.0% 0.140 152);
            --color-accent-2:   oklch(42.0% 0.140 152);
            --color-accent-ink: oklch(100%  0     0);
            --color-focus:      oklch(52.0% 0.170 150);
            --color-ok:         oklch(50.0% 0.130 155);
            --color-err:        oklch(50.0% 0.190 25);
            --color-err-bg:     oklch(96.5% 0.020 25);
            --color-code-bg:    oklch(20.0% 0.020 250);
            --color-code-ink:   oklch(93.0% 0.010 250);

            /* ── 玻璃与背景 ─────────────────────────────────────── */
            /* 单次请求：只在 ::before 里用一次，避免原版两次下载两张不同图 */
            --bg-image: url("https://uapis.cn/api/v1/image/bing-daily?random=true&resolution=1080");
            /* 遮罩：把任意亮度的图归一化到浅色区间，保证对比度可预测 */
            --color-scrim:    oklch(98.2% 0.004 250 / 0.28);
            --glass-alpha:    0.88;
            --glass-blur:     22px;
            --glass-edge:     oklch(100% 0 0 / 0.55);
            /* 输入控件用近实底：这是要读要改的内容，不该被背景干扰 */
            --color-input-bg: oklch(100% 0 0 / 0.92);

            /* ── 字体 ───────────────────────────────────────────── */
            --font-body: system-ui, -apple-system, "Segoe UI", "PingFang SC",
                         "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code",
                         Menlo, Consolas, "Liberation Mono", monospace;

            /* ── 间距（4pt 语义刻度）────────────────────────────── */
            --space-2xs: 0.25rem;
            --space-xs:  0.5rem;
            --space-sm:  0.75rem;
            --space-md:  1rem;
            --space-lg:  1.5rem;

            /* ── 字号 ───────────────────────────────────────────── */
            --text-xs:  0.75rem;
            --text-sm:  0.8125rem;
            --text-md:  0.9375rem;
            --text-xl:  1.375rem;

            /* ── 圆角 ───────────────────────────────────────────── */
            --radius-input: 6px;
            --radius-card:  12px;
            --radius-pill:  999px;

            /* ── 动效 ───────────────────────────────────────────── */
            --ease-out:  cubic-bezier(0.16, 1, 0.3, 1);
            --dur-short: 120ms;

            /* ── 层级 ───────────────────────────────────────────── */
            --z-backdrop: 0;
            --z-content:  1;
        }

        /* ── 基础 ───────────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; }

        html {
            overflow-x: clip;
            -webkit-text-size-adjust: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            /* 内容溢出时 flex 居中会把溢出量对半分到上下，顶部永久滚不到。
               改用 margin:auto 让居中在溢出时自然退化。 */
            justify-content: flex-start;
            min-height: 100dvh;
            margin: 0;
            padding: var(--space-lg) var(--space-md);
            font-family: var(--font-body);
            font-size: var(--text-md);
            line-height: 1.55;
            color: var(--color-ink);
            /* 图片未加载 / 加载失败时的兜底底色 */
            background-color: var(--color-paper);
            overflow-x: clip;
        }

        /* 背景图：单次请求 + 模糊。用 position:fixed 而非 background-attachment:fixed，
           后者在 iOS Safari 上不生效。inset:-30px 向外溢出以抵消 blur 边缘羽化。 */
        body::before {
            content: '';
            position: fixed;
            inset: -30px;
            z-index: var(--z-backdrop);
            background-image: var(--bg-image);
            background-color: var(--color-paper);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(22px) saturate(1.1);
            pointer-events: none;
        }

        /* 遮罩：把随机图的亮度归一化，让对比度不再随图漂移 */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: var(--z-backdrop);
            background: var(--color-scrim);
            pointer-events: none;
        }

        .shell {
            position: relative;
            z-index: var(--z-content);
            width: 100%;
            max-width: 1080px;
            /* 空间充足时垂直居中，不足时自然顶对齐 */
            margin: auto 0;
        }

        /* ── 玻璃面板：承载全部文字 ─────────────────────────────── */
        .glass {
            padding: var(--space-lg);
            background: oklch(100% 0 0 / var(--glass-alpha));
            border: 1px solid var(--glass-edge);
            border-radius: var(--radius-card);
            backdrop-filter: blur(var(--glass-blur)) saturate(1.15);
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.15);
            box-shadow:
                0 1px 2px oklch(0% 0 0 / 0.05),
                0 12px 40px oklch(0% 0 0 / 0.10);
        }

        /* 不支持 backdrop-filter 时退回近实底，宁可少一点玻璃感，也不让文字不可读 */
        @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
            .glass { background: oklch(100% 0 0 / 0.97); }
        }

        /* ── 页头 ───────────────────────────────────────────────── */
        .page-head {
            display: flex;
            flex-direction: column;
            gap: var(--space-2xs);
            padding-bottom: var(--space-md);
            border-bottom: 1px solid var(--color-rule);
        }

        .page-head h1 {
            margin: 0;
            font-size: var(--text-xl);
            font-weight: 650;
            line-height: 1.25;
            letter-spacing: -0.011em;
            color: var(--color-ink);
        }

        .page-head p {
            margin: 0;
            font-size: var(--text-sm);
            color: var(--color-ink-2);
        }

        /* ── 双栏工作台：发丝分隔，不做卡片套卡片 ───────────────── */
        .workbench {
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
            gap: 0;
            margin-top: var(--space-md);
        }

        .pane {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
            /* 关键：允许 grid 项收缩到内容以下，否则长 token 会撑破布局 */
            min-width: 0;
            padding: 0 var(--space-md) 0 0;
        }

        .pane + .pane {
            padding: 0 0 0 var(--space-md);
            border-left: 1px solid var(--color-rule);
        }

        .pane__head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: var(--space-sm);
            min-height: 1.75rem;
        }

        .pane__title {
            margin: 0;
            font-size: var(--text-sm);
            font-weight: 600;
            letter-spacing: 0.01em;
            color: var(--color-ink-2);
        }

        .pane__meta {
            font-size: var(--text-xs);
            font-variant-numeric: tabular-nums;
            color: var(--color-ink-3);
        }

        #temp-json-form {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
            flex: 1;
            min-width: 0;
        }

        /* 生成表单是固定高度的工具栏，不能 flex:1，否则会把输出区挤到底部 */
        #generate-form {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
            min-width: 0;
        }

        /* ── 表单控件 ───────────────────────────────────────────── */
        textarea {
            width: 100%;
            min-height: 22rem;
            flex: 1;
            padding: var(--space-sm);
            font-family: var(--font-mono);
            font-size: var(--text-sm);
            line-height: 1.6;
            color: var(--color-ink);
            background: var(--color-input-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-input);
            resize: vertical;
            tab-size: 2;
        }

        textarea::placeholder { color: var(--color-ink-3); }

        textarea:focus-visible,
        select:focus-visible {
            outline: 2px solid var(--color-focus);
            outline-offset: 2px;
        }

        select {
            flex: 1;
            min-width: 0;
            padding: var(--space-xs) var(--space-sm);
            font: inherit;
            font-size: var(--text-sm);
            color: var(--color-ink);
            background: var(--color-input-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-input);
        }

        .pane__controls {
            display: flex;
            align-items: center;
            gap: var(--space-xs);
        }

        .pane__foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-sm);
            flex-wrap: wrap;
        }

        /* ── 按钮 ───────────────────────────────────────────────── */
        .btn {
            font: inherit;
            font-size: var(--text-sm);
            font-weight: 550;
            padding: var(--space-xs) var(--space-md);
            border: 1px solid transparent;
            border-radius: var(--radius-input);
            cursor: pointer;
            /* 点击标签永不折行 */
            white-space: nowrap;
            transition: background-color var(--dur-short) var(--ease-out),
                        border-color     var(--dur-short) var(--ease-out),
                        color            var(--dur-short) var(--ease-out);
        }

        .btn--primary {
            background: var(--color-accent);
            color: var(--color-accent-ink);
        }
        .btn--primary:hover:not(:disabled) { background: var(--color-accent-2); }
        .btn--primary:active:not(:disabled) { transform: translateY(1px); }

        .btn--ghost {
            background: var(--color-input-bg);
            border-color: var(--color-border);
            color: var(--color-ink-2);
        }
        .btn--ghost:hover:not(:disabled) {
            background: var(--color-surface);
            color: var(--color-ink);
        }

        .btn--quiet {
            padding: var(--space-2xs) var(--space-xs);
            background: transparent;
            color: var(--color-ink-2);
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .btn--quiet:hover:not(:disabled) { color: var(--color-ink); }

        /* 焦点环必须即时出现，不做过渡 */
        .btn:focus-visible {
            outline: 2px solid var(--color-focus);
            outline-offset: 2px;
        }

        .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        /* 显式兜底：display 声明不会覆盖 hidden */
        .btn[hidden] { display: none; }

        /* ── 输出区 ─────────────────────────────────────────────── */
        #config-text {
            flex: 1;
            min-height: 22rem;
            max-height: 62dvh;
            margin: 0;
            padding: var(--space-sm);
            font-family: var(--font-mono);
            font-size: var(--text-sm);
            line-height: 1.6;
            color: var(--color-code-ink);
            background: var(--color-code-bg);
            border-radius: var(--radius-input);
            white-space: pre-wrap;
            overflow: auto;
        }

        #config-text:focus-visible {
            outline: 2px solid var(--color-focus);
            outline-offset: 2px;
        }

        /* ── 状态条 ─────────────────────────────────────────────── */
        .status {
            display: flex;
            align-items: center;
            gap: var(--space-xs);
            min-height: 1.5rem;
            margin-top: var(--space-md);
            padding-top: var(--space-sm);
            border-top: 1px solid var(--color-rule);
            font-size: var(--text-sm);
            color: var(--color-ink-2);
        }

        .status__dot {
            flex: none;
            width: 7px;
            height: 7px;
            border-radius: var(--radius-pill);
            background: var(--color-ink-3);
            transition: background-color var(--dur-short) var(--ease-out);
        }

        .status[data-state="ok"] .status__dot { background: var(--color-ok); }
        .status[data-state="error"] .status__dot { background: var(--color-err); }
        .status[data-state="error"] { color: var(--color-err); }

        /* ── Flash 消息 ─────────────────────────────────────────── */
        .flashes {
            margin: 0 0 var(--space-md);
            padding: var(--space-sm) var(--space-md);
            list-style: none;
            font-size: var(--text-sm);
            color: var(--color-err);
            background: var(--color-err-bg);
            border: 1px solid var(--color-err);
            border-radius: var(--radius-input);
        }

        .flashes li + li { margin-top: var(--space-2xs); }

        /* ── 无障碍 ─────────────────────────────────────────────── */
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
            border: 0;
        }

        /* ── 响应式 ─────────────────────────────────────────────── */
        @media (max-width: 860px) {
            .workbench { grid-template-columns: minmax(0, 1fr); }

            .pane { padding: 0; }
            .pane + .pane {
                padding: var(--space-md) 0 0;
                border-left: 0;
                border-top: 1px solid var(--color-rule);
                margin-top: var(--space-md);
            }

            textarea,
            #config-text { min-height: 16rem; }
        }

        @media (max-width: 420px) {
            body { padding: var(--space-md) var(--space-sm); }
            .glass { padding: var(--space-md); }
            .pane__controls { flex-wrap: wrap; }
            .pane__controls .btn { width: 100%; }
            /* 小屏降模糊强度，省 GPU */
            :root { --glass-blur: 14px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: 1ms !important;
                animation-duration: 1ms !important;
            }
        }

        /* 用户偏好减少透明时，直接给实底 */
        @media (prefers-reduced-transparency: reduce) {
            :root { --glass-alpha: 0.98; }
            body::before { filter: blur(22px) saturate(1.1) opacity(0.5); }
        }
    </style>
</head>
<body>

    <div class="shell">
        <div class="glass">

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <ul class="flashes">
                        {% for message in messages %}<li>{{ message }}</li>{% endfor %}
                    </ul>
                {% endif %}
            {% endwith %}

            <header class="page-head">
                <h1>sing-box 配置转换器</h1>
                <p>粘贴订阅配置，保存后选择模板生成 sing-box 配置。</p>
            </header>

            <main class="workbench">

                <!-- 左栏：输入 -->
                <section class="pane">
                    <div class="pane__head">
                        <h2 class="pane__title">
                            <label for="temp_json_data">配置 JSON</label>
                        </h2>
                        <span class="pane__meta" id="json-meta">0 行</span>
                    </div>

                    <form id="temp-json-form" method="POST" action="/edit_temp_json">
                        <textarea id="temp_json_data"
                                  name="temp_json_data"
                                  placeholder="请输入 JSON 配置…"
                                  spellcheck="false"
                                  autocomplete="off"
                                  autocapitalize="off">{{ temp_json_data | default('') }}</textarea>
                        <div class="pane__foot">
                            <span class="pane__meta" id="json-hint">保存后即可生成</span>
                            <button type="submit" class="btn btn--ghost" id="save-btn">保存配置</button>
                        </div>
                    </form>
                </section>

                <!-- 右栏：输出 -->
                <section class="pane">
                    <div class="pane__head">
                        <h2 class="pane__title" id="output-heading">生成结果</h2>
                        <button type="button" class="btn btn--quiet" id="copy-btn" hidden>复制</button>
                    </div>

                    <form id="generate-form" method="POST" action="/generate_config">
                        <div class="pane__controls">
                            <label class="visually-hidden" for="template_index">配置模板</label>
                            <select id="template_index" name="template_index">
                                {% for option in template_options %}
                                <option value="{{ loop.index - 1 }}">{{ option }}</option>
                                {% endfor %}
                            </select>
                            <button type="submit" class="btn btn--primary" id="gen-btn">生成配置</button>
                        </div>
                    </form>

                    <pre id="config-text" role="region" aria-label="生成结果" tabindex="0">生成的结果将显示在这里…</pre>
                </section>

            </main>

            <div class="status" id="status" role="status" aria-live="polite">
                <span class="status__dot" aria-hidden="true"></span>
                <span class="status__text">就绪</span>
            </div>

        </div>
    </div>

    <script>
        (function () {
            'use strict';

            const $ = (id) => document.getElementById(id);

            const statusEl   = $('status');
            const statusText = statusEl.querySelector('.status__text');
            const output     = $('config-text');
            const copyBtn    = $('copy-btn');
            const textarea   = $('temp_json_data');
            const jsonMeta   = $('json-meta');
            const jsonHint   = $('json-hint');

            let lastSavedValue = null;

            /* ── 状态条 ─────────────────────────────────────────── */
            function setStatus(state, text) {
                statusEl.dataset.state = state;
                statusText.textContent = text;
            }

            /* ── 按钮忙碌态 ─────────────────────────────────────── */
            function setBusy(btn, busy, busyLabel) {
                if (busy) {
                    btn.dataset.idleLabel = btn.dataset.idleLabel || btn.textContent;
                    btn.textContent = busyLabel;
                    btn.disabled = true;
                    btn.setAttribute('aria-busy', 'true');
                } else {
                    btn.textContent = btn.dataset.idleLabel || btn.textContent;
                    btn.disabled = false;
                    btn.removeAttribute('aria-busy');
                }
            }

            /* ── 行数指示 + 未保存提示 ──────────────────────────── */
            function syncMeta() {
                const value = textarea.value;
                const lines = value ? value.split('\n').length : 0;
                jsonMeta.textContent = lines + ' 行';

                if (lastSavedValue === null) {
                    jsonHint.textContent = '保存后即可生成';
                    return;
                }
                if (value === lastSavedValue) {
                    jsonHint.textContent = '已保存';
                } else {
                    jsonHint.textContent = '有未保存的修改';
                }
            }

            /* ── 步骤 1：保存 ───────────────────────────────────── */
            $('temp-json-form').addEventListener('submit', async (event) => {
                event.preventDefault();

                const form = event.target;
                const btn  = $('save-btn');

                // 本地先校验 JSON 语法，避免白跑一次网络请求
                try {
                    JSON.parse(textarea.value);
                } catch (err) {
                    setStatus('error', 'JSON 语法错误：' + err.message);
                    textarea.focus();
                    return;
                }

                setBusy(btn, true, '保存中…');
                setStatus('', '正在保存…');

                try {
                    const response = await fetch(form.action, {
                        method: form.method,
                        body: new FormData(form),
                    });

                    if (!response.ok) {
                        throw new Error('HTTP ' + response.status);
                    }

                    output.textContent = await response.text();
                    copyBtn.hidden = false;
                    lastSavedValue = textarea.value;
                    syncMeta();
                    setStatus('ok', '已保存 · 可以生成配置了');
                } catch (err) {
                    setStatus('error', '保存失败：' + err.message + '。请检查网络后重试。');
                } finally {
                    setBusy(btn, false);
                }
            });

            /* ── 步骤 2：生成 ───────────────────────────────────── */
            $('generate-form').addEventListener('submit', async (event) => {
                event.preventDefault();

                const form = event.target;
                const btn  = $('gen-btn');

                // 提示未保存状态，但不阻止——后端读上一次保存的内容
                if (lastSavedValue !== null && textarea.value !== lastSavedValue) {
                    setStatus('', '注意：当前 JSON 尚未保存，将使用上次保存的内容生成');
                }

                setBusy(btn, true, '生成中…');

                try {
                    const response = await fetch(form.action, {
                        method: 'POST',
                        body: new FormData(form),
                    });

                    if (!response.ok) {
                        throw new Error('HTTP ' + response.status);
                    }

                    output.textContent = await response.text();
                    copyBtn.hidden = false;
                    setStatus('ok', '生成完成');
                } catch (err) {
                    setStatus('error', '生成失败：' + err.message + '。请检查网络后重试。');
                } finally {
                    setBusy(btn, false);
                }
            });

            /* ── 复制结果 ───────────────────────────────────────── */
            copyBtn.addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText(output.textContent);
                    copyBtn.textContent = '已复制';
                    setTimeout(() => { copyBtn.textContent = '复制'; }, 1600);
                } catch (err) {
                    setStatus('error', '复制失败，请手动选中文本复制。');
                }
            });

            /* ── 初始化 ─────────────────────────────────────────── */
            textarea.addEventListener('input', syncMeta);
            syncMeta();
        })();
    </script>
</body>
</html>
